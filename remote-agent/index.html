<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsuranceOne Remote Assistance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 30px;
      max-width: 400px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 28px;
    }

    h1 {
      font-size: 24px;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
    }

    .status-section {
      background: #f7fafc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-indicator.connected {
      background: #48bb78;
      box-shadow: 0 0 8px rgba(72, 187, 120, 0.5);
    }

    .status-indicator.disconnected {
      background: #f56565;
    }

    .status-indicator.pending {
      background: #ed8936;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 14px;
      color: #2d3748;
    }

    .status-text.secondary {
      color: #718096;
      font-size: 12px;
    }

    .info-box {
      background: #edf2f7;
      border-left: 4px solid #667eea;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #2d3748;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #a0aec0;
    }

    .version {
      display: inline-block;
      background: #edf2f7;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔐</div>
      <h1>Remote Assistance</h1>
      <p class="subtitle">InsuranceOne Agent</p>
    </div>

    <div class="status-section">
      <div class="status-item">
        <div class="status-indicator connected" id="connectionStatus"></div>
        <div>
          <div class="status-text" id="connectionText">Connecting...</div>
          <div class="status-text secondary" id="connectionDetail"></div>
        </div>
      </div>

      <div class="status-item">
        <div class="status-indicator" id="agentStatus"></div>
        <div>
          <div class="status-text" id="agentText">Agent Status</div>
          <div class="status-text secondary" id="agentDetail"></div>
        </div>
      </div>
    </div>

    <div class="info-box">
      ℹ️ This agent enables remote assistance during video consultations. Keep it running in the background.
    </div>

    <div class="button-group">
      <button class="btn-secondary" onclick="minimizeWindow()">Minimize</button>
      <button class="btn-primary" onclick="openSettings()">Settings</button>
    </div>

    <div class="footer">
      <div class="version">v1.0.0</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    async function updateStatus() {
      try {
        const status = await ipcRenderer.invoke('get-agent-status');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        const connectionDetail = document.getElementById('connectionDetail');

        if (status.connected) {
          connectionStatus.className = 'status-indicator connected';
          connectionText.textContent = 'Connected to Website';
          connectionDetail.textContent = `Version: ${status.version || 'Unknown'}`;
        } else {
          connectionStatus.className = 'status-indicator disconnected';
          connectionText.textContent = 'Disconnected';
          connectionDetail.textContent = 'Waiting for connection...';
        }
      } catch (err) {
        console.error('Failed to get status:', err);
      }
    }

    function minimizeWindow() {
      ipcRenderer.send('minimize-window');
    }

    function openSettings() {
      // TODO: Implement settings window
      alert('Settings coming soon');
    }

    // Update status every 2 seconds
    updateStatus();
    setInterval(updateStatus, 2000);

    // Listen for connection changes
    ipcRenderer.on('agent-connection-status', (event, status) => {
      updateStatus();
    });
  </script>
</body>
</html>
